<script>
// Watchdog: se o app não renderizar em 8s, mostra mensagem clara em vez de tela branca
window.__bootWatchdog = setTimeout(function () {
  var root = document.getElementById('root');
  if (root && !root.hasChildNodes()) {
    root.innerHTML =
      '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;' +
      'height:100%;padding:32px;text-align:center;font-family:sans-serif;background:#f5f5f7">' +
      '<span style="font-size:40px;margin-bottom:12px">📡</span>' +
      '<h2 style="font-size:17px;color:#111;margin-bottom:8px">Não foi possível carregar o app</h2>' +
      '<p style="font-size:13px;color:#888;margin-bottom:18px;line-height:1.5">' +
      'Verifique sua conexão com a internet e tente novamente.</p>' +
      '<button onclick="location.reload()" style="padding:12px 28px;background:#F97316;color:#fff;' +
      'border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer">Tentar novamente</button>' +
      '</div>';
  }
}, 8000);
</script>

#root{height:100%;display:flex;flex-direction:column}
::-webkit-scrollbar{display:none}
input,select,textarea{font-family:inherit}
button{-webkit-appearance:none;appearance:none}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideRight{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.fade{animation:fadeIn .2s ease both}
.slideUp{animation:slideUp .25s cubic-bezier(.4,0,.2,1) both}
.slideRight{animation:slideRight .22s cubic-bezier(.4,0,.2,1) both}
.pulse{animation:pulse 1.5s ease infinite}

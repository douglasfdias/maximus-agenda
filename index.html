function hoje(){
  const d=new Date();
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
}
function parseDate(s){
  if(!s)return null;
  const p=s.split('/');
  if(p.length!==3)return null;
  return new Date(p[2],p[1]-1,p[0]);
}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function fmtDate(d){return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;}
function isHoje(s){return s===hoje();}
function isAmanha(s){return s===fmtDate(addDays(new Date(),1));}

// ─── API ───────────────────────────────────────────────────────
function getConfig(){
  return {
    apiUrl: localStorage.getItem('mm_apiUrl')||DEFAULT_API,
    token:  localStorage.getItem('mm_token')||'',
    wa:     localStorage.getItem('mm_wa')||'',
  };
}
function saveConfig(c){
  localStorage.setItem('mm_apiUrl',c.apiUrl||DEFAULT_API);
  localStorage.setItem('mm_token',c.token||'');
  localStorage.setItem('mm_wa',c.wa||'');
}

async function apiFetch(params={}){
  const {apiUrl,token}=getConfig();
  const p=new URLSearchParams({token,...params});
  const url=`${apiUrl}?${p}`;
  // Tenta fetch normal primeiro; se falhar por CORS/redirect usa XHR como fallback
  const tryXHR = () => new Promise((resolve,reject)=>{
    const xhr=new XMLHttpRequest();
    xhr.open('GET',url,true);
    xhr.onload=()=>{
      try{
        const json=JSON.parse(xhr.responseText);
        if(!json.ok) reject(new Error(json.erro||'Erro desconhecido'));
        else resolve(json);
      }catch(e){reject(new Error('Resposta inválida do servidor'));}
    };
    xhr.onerror=()=>reject(new Error('Sem acesso ao servidor. Verifique a URL nas Configurações.'));
    xhr.ontimeout=()=>reject(new Error('Timeout — servidor demorou demais.'));
    xhr.timeout=30000;
    xhr.send();
  });
  try{
    const res=await fetch(url,{redirect:'follow'});
    const text=await res.text();
    if(!text||text.trim()==='') return tryXHR();
    const json=JSON.parse(text);
    if(!json.ok) throw new Error(json.erro||'Erro desconhecido');
    return json;
  }catch(e){
    if(e.message==='Failed to fetch'||e.message.includes('NetworkError')||e.message.includes('fetch')){
      return tryXHR();
    }
    throw e;
  }
}

async function apiAdd(aba,dados){

                  </select>
                </div>
              </div>
              <div><label style={lbl}>Data de entrega</label><input style={inp} type="date" value={form._dateISO||''} onChange={e=>{const d=new Date(e.target.value+'T12:00:00');set('dataVenc',fmtDate(d));set('_dateISO',e.target.value);}}/></div>
              <div><label style={lbl}>Descrição</label><textarea style={{...inp,resize:'none',minHeight:60}} value={form.descricao} onChange={e=>set('descricao',e.target.value)} placeholder="Detalhes opcionais..."/></div>
            </>
          ):(
            <>
              <div><label style={lbl}>Título *</label><input style={inp} value={comForm.titulo} onChange={e=>setCom('titulo',e.target.value)} placeholder="Ex: Reunião de Pais — 10/05"/></div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
                <div><label style={lbl}>Para</label>
                  <select style={inp} value={comForm.filho} onChange={e=>setCom('filho',e.target.value)}>
                    <option value="iza">Iza</option><option value="israel">Israel</option><option value="ambos">Ambos</option>
                  </select>
                </div>
                <div><label style={lbl}>Etiqueta</label>
                  <select style={inp} value={comForm.etiqueta} onChange={e=>setCom('etiqueta',e.target.value)}>
                    {['Escola','Professor(a)','Evento','Financeiro','Saúde'].map(t=><option key={t} value={t}>{t}</option>)}
                  </select>
                </div>
              </div>
              <div><label style={lbl}>Remetente</label><input style={inp} value={comForm.remetente} onChange={e=>setCom('remetente',e.target.value)} placeholder="Ex: Profª Bruna"/></div>
              <div><label style={lbl}>Data</label><input style={inp} type="date" value={comForm._dateISO||''} onChange={e=>{const d=new Date(e.target.value+'T12:00:00');setCom('data',fmtDate(d));setCom('_dateISO',e.target.value);}}/></div>
              <div><label style={lbl}>Conteúdo *</label><textarea style={{...inp,resize:'none',minHeight:80}} value={comForm.conteudo} onChange={e=>setCom('conteudo',e.target.value)} placeholder="Mensagem do comunicado..."/></div>
            </>
          )}
        </div>
        <div style={{padding:'16px 20px 0'}}>
          <button onClick={handleSave} disabled={loading} style={{width:'100%',padding:'14px 0',background:ACCENT,color:'#fff',border:'none',borderRadius:14,fontSize:15,fontWeight:800,cursor:'pointer',opacity:loading?.7:1}}>
            {loading?'Salvando…':'Salvar'}
          </button>
        </div>
      </div>
    </div>
  );
};

// HOME SCREEN
// ═══════════════════════════════════════════════════════════════
const HomeScreen=({itens,comunicados,setScreen,onWA})=>{
  const now=new Date();
  const hojeStr=hoje();
  const nomesDia=['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];

  const pendentes=itens.filter(i=>i.status!=='concluido'&&i.status!=='concluído');
  const paraHoje =pendentes.filter(i=>i.dataVenc===hojeStr);
  const unread   =comunicados.filter(c=>!c._lido).length;

  const proximos=useMemo(()=>{
    const limit=fmtDate(addDays(now,7));
    return pendentes
      .filter(i=>i.dataVenc&&i.dataVenc>hojeStr&&i.dataVenc<=limit)
      .sort((a,b)=>(parseDate(a.dataVenc)||0)-(parseDate(b.dataVenc)||0))
      .slice(0,5);
  },[itens]);

  const total=pendentes.length;

  return(

        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginTop:4,marginBottom:14}}>
          <h1 style={{fontSize:24,fontWeight:800,color:'#111',lineHeight:1.2}}>Olá, dupla! 👋</h1>

            <Avatar owner="iza" size={34}/>
            <Avatar owner="israel" size={34}/>
          </div>
        </div>

        {/* Atalhos */}
        <div style={{display:'flex',gap:8,marginBottom:14}}>
          {[{id:'horario',e:'🗓',l:'Horário',c:'#6366F1',bg:'#EEF2FF'},{id:'boletim',e:'📊',l:'Boletim',c:'#0891B2',bg:'#ECFEFF'},{id:'avisos',e:'🔔',l:'Avisos',c:'#D97706',bg:'#FFFBEB',b:unread}].map(item=>(
            <button key={item.id} onClick={()=>setScreen(item.id)} style={{flex:1,background:item.bg,border:'none',borderRadius:14,padding:'10px 4px',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:4,position:'relative'}}>
              {item.b>0&&<div style={{position:'absolute',top:6,right:8,width:14,height:14,borderRadius:7,background:'#EF4444',color:'#fff',fontSize:8,fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center'}}>{item.b}</div>}
              <span style={{fontSize:20}}>{item.e}</span>
              <span style={{fontSize:10,fontWeight:700,color:item.c}}>{item.l}</span>
            </button>
          ))}
        </div>

        {/* Banner progresso */}
        <div style={{background:`linear-gradient(135deg,${ACCENT} 0%,#fb923c 100%)`,borderRadius:20,padding:'16px 18px',display:'flex',alignItems:'center',gap:14,boxShadow:`0 6px 20px ${ACCENT}44`,marginBottom:20}}>
          <div style={{flex:1}}>
            <p style={{fontSize:12,color:'rgba(255,255,255,.85)',fontWeight:500}}>Tarefas pendentes</p>
            <p style={{fontSize:22,fontWeight:800,color:'#fff',margin:'2px 0 8px'}}>{total} tarefas</p>
            <div style={{background:'rgba(255,255,255,.3)',borderRadius:99,height:6,overflow:'hidden'}}>
              <div style={{width:total>0?`${Math.round(concluidos/(total+concluidos)*100)}%`:'0%',height:'100%',background:'#fff',borderRadius:99,transition:'width .5s'}}/>
            </div>
          </div>
          {/* Botão WhatsApp */}
          <button onClick={onWA} style={{background:'rgba(255,255,255,.2)',border:'none',borderRadius:16,padding:'10px 12px',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:4}}>
            <span style={{fontSize:22}}>📲</span>
            <span style={{fontSize:9,fontWeight:700,color:'#fff'}}>WhatsApp</span>
          </button>
        </div>

        {/* Para hoje */}
        <h2 style={{fontSize:16,fontWeight:700,color:'#111',marginBottom:10}}>Para hoje</h2>
        {paraHoje.length===0
          ?<div style={{background:'#fff',borderRadius:14,padding:'14px 16px',marginBottom:16,boxShadow:'0 1px 4px rgba(0,0,0,.06)'}}><p style={{color:'#aaa',fontSize:13}}>Nada pendente para hoje 🎉</p></div>
          :paraHoje.map(item=>(
            <div key={item.id} style={{background:'#fff',borderRadius:14,padding:'12px 14px',marginBottom:8,display:'flex',alignItems:'center',gap:10,boxShadow:'0 1px 4px rgba(0,0,0,.06)',borderLeft:`3px solid ${getSub(item.materia).color}`}}>
              <div style={{flex:1}}>
                <p style={{fontSize:13,fontWeight:600,color:'#111',marginBottom:4}}>{item.titulo}</p>
                <div style={{display:'flex',gap:6,alignItems:'center'}}><SubChip materia={item.materia} small/><Avatar owner={item.filho} size={18}/></div>
              </div>
              <div style={{width:20,height:20,borderRadius:10,border:`2px solid ${ACCENT}`,flexShrink:0}}/>
            </div>
          ))

        {/* Próximos */}
        {proximos.length>0&&(
          <>
            <h2 style={{fontSize:16,fontWeight:700,color:'#111',margin:'16px 0 10px'}}>Próximos 7 dias</h2>
            {proximos.map(item=>{
              const s=getSub(item.materia);
              const dParts=item.dataVenc.split('/');
              return(
                <div key={item.id} style={{background:'#fff',borderRadius:14,padding:'12px 14px',marginBottom:8,display:'flex',alignItems:'center',gap:12,boxShadow:'0 1px 4px rgba(0,0,0,.06)'}}>
                  <div style={{width:40,height:40,borderRadius:12,background:s.bg,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',flexShrink:0}}>

                    <span style={{fontSize:9,color:s.color,fontWeight:600,opacity:.7}}>{MESES_ABR[parseInt(dParts[1])-1]}</span>
                  </div>
                  <div style={{flex:1}}>
                    <p style={{fontSize:13,fontWeight:600,color:'#111'}}>{item.titulo}</p>
                    <div style={{display:'flex',gap:6,alignItems:'center',marginTop:3}}><SubChip materia={item.materia} small/><Avatar owner={item.filho} size={18}/></div>
                  </div>
                </div>
              );
            })}
          </>
        )}
      </div>
    </div>
  );
};

// TASKS SCREEN
// ═══════════════════════════════════════════════════════════════
const TasksScreen=({itens,onToggle,onDelete,loading})=>{
  const [view,setView]=useState('list');
  const [filho,setFilho]=useState('all');
  const [statusF,setStatusF]=useState('pendente');

  const filtered=itens.filter(i=>{
    const matchF=filho==='all'||i.filho===filho||i.filho==='ambos';
    const isPend=i.status!=='concluido'&&i.status!=='concluído';
    const matchS=statusF==='pendente'?isPend:!isPend;
    return matchF&&matchS;
  });

  const COLS=[
    {id:'pendente',label:'A fazer',color:'#94A3B8'},
    {id:'andamento',label:'Em andamento',color:ACCENT},
    {id:'concluido',label:'Concluído',color:'#16A34A'},
  ];

  const hoje2=hoje();
  const getUrgencia=(item)=>{
    if(!item.dataVenc)return'normal';
    const dt=parseDate(item.dataVenc);
    if(!dt)return'normal';
    const diff=Math.round((dt-new Date())/(1000*60*60*24));
    if(diff<0)return'vencido';
    if(diff===0)return'hoje';
    if(diff<=2)return'urgente';
    return'normal';
  };
  const urgColors={vencido:'#DC2626',hoje:'#DC2626',urgente:'#D97706',normal:'transparent'};

  return(
    <div className="fade" style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
      <div style={{padding:'16px 20px 10px',flexShrink:0}}>
        <h1 style={{fontSize:22,fontWeight:800,color:'#111',marginBottom:12}}>Tarefas</h1>
        <div style={{display:'flex',background:'#ebebeb',borderRadius:12,padding:3,marginBottom:10}}>
          {[['list','≡ Lista'],['kanban','⊞ Kanban']].map(([v,l])=>(
            <button key={v} onClick={()=>setView(v)} style={{flex:1,padding:'6px 0',borderRadius:9,background:view===v?'#fff':'transparent',border:'none',cursor:'pointer',fontSize:12,fontWeight:600,color:view===v?'#111':'#888',boxShadow:view===v?'0 1px 4px rgba(0,0,0,.1)':'none',transition:'all .2s'}}>{l}</button>
          ))}
        </div>
        <div style={{display:'flex',gap:6,marginBottom:8}}>
          {[['all','Todos'],['iza','Iza'],['israel','Israel']].map(([v,l])=>(
            <button key={v} onClick={()=>setFilho(v)} style={{padding:'5px 12px',borderRadius:99,background:filho===v?ACCENT:'#fff',color:filho===v?'#fff':'#666',border:`1.5px solid ${filho===v?ACCENT:'#e0e0e0'}`,fontSize:11,fontWeight:600,cursor:'pointer',transition:'all .15s'}}>{l}</button>
          ))}
          <div style={{marginLeft:'auto',display:'flex',gap:4}}>
            {[['pendente','Pendentes'],['concluido','Concluídos']].map(([v,l])=>(
              <button key={v} onClick={()=>setStatusF(v)} style={{padding:'5px 10px',borderRadius:99,background:statusF===v?'#111':'#fff',color:statusF===v?'#fff':'#888',border:'1.5px solid #e0e0e0',fontSize:10,fontWeight:600,cursor:'pointer'}}>{l}</button>
            ))}
          </div>
        </div>
      </div>

      {view==='list'?(
        <div style={{flex:1,overflowY:'auto',padding:'0 20px'}}>
          {filtered.length===0&&<EmptyState emoji="✅" msg="Nenhuma tarefa encontrada"/>}
          {filtered.sort((a,b)=>{
            const da=parseDate(a.dataVenc)||new Date(9999,0);
            const db=parseDate(b.dataVenc)||new Date(9999,0);
            return da-db;
          }).map(item=>{
            const s=getSub(item.materia);
            const urg=getUrgencia(item);
            const done=item.status==='concluido'||item.status==='concluído';
            return(
              <div key={item.id} style={{background:'#fff',borderRadius:14,padding:'12px 14px',marginBottom:8,display:'flex',alignItems:'center',gap:10,boxShadow:'0 1px 4px rgba(0,0,0,.06)',opacity:done?.55:1,borderLeft:`3px solid ${urg==='normal'?s.color:urgColors[urg]}`}}>
                <button onClick={()=>onToggle(item)} style={{width:22,height:22,borderRadius:11,flexShrink:0,background:done?ACCENT:'transparent',border:`2px solid ${done?ACCENT:'#ccc'}`,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',transition:'all .2s',padding:0}}>
                  {done&&<svg width="11" height="11" viewBox="0 0 11 11"><polyline points="2,5.5 4.5,8 9,3" stroke="#fff" strokeWidth="1.8" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>}
                </button>
                <div style={{flex:1,minWidth:0}}>
                  <p style={{fontSize:13,fontWeight:600,color:'#111',textDecoration:done?'line-through':'none',marginBottom:3,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{item.titulo}</p>
                  <div style={{display:'flex',gap:6,alignItems:'center'}}>
                    <SubChip materia={item.materia} small/>
                    {item.dataVenc&&<span style={{fontSize:10,color:urg==='vencido'||urg==='hoje'?'#DC2626':urg==='urgente'?'#D97706':'#aaa',fontWeight:600}}>{item.dataVenc}</span>}
                    <Avatar owner={item.filho} size={16}/>
                  </div>
                </div>
                <button onClick={()=>onDelete('Itens',item.id)} style={{background:'none',border:'none',padding:'4px',cursor:'pointer',opacity:.4,flexShrink:0}}>
                  <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 4h10M5 4V3a1 1 0 011-1h2a1 1 0 011 1v1M11 4l-.7 7a1 1 0 01-1 .9H4.7a1 1 0 01-1-.9L3 4" stroke="#888" strokeWidth="1.4" strokeLinecap="round"/></svg>
                </button>
              </div>
            );
          })}
        </div>
      ):(
        <div style={{flex:1,overflowX:'auto',overflowY:'hidden'}}>
          <div style={{display:'flex',gap:10,padding:'0 20px 16px',height:'100%',minWidth:'max-content'}}>
            {COLS.map(col=>{
              const colItems=itens.filter(i=>{
                const isPend=i.status!=='concluido'&&i.status!=='concluído';
                const inCol=col.id==='concluido'?!isPend:(col.id==='andamento'?(i.tipo==='prova'&&isPend):isPend&&i.tipo!=='prova');
                const matchF=filho==='all'||i.filho===filho||i.filho==='ambos';
                return inCol&&matchF;
              });
              return(
                <div key={col.id} style={{width:210,flexShrink:0,display:'flex',flexDirection:'column',background:'#f0f0f2',borderRadius:18,padding:'12px 10px',maxHeight:'100%'}}>
                  <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
                    <div style={{width:8,height:8,borderRadius:4,background:col.color}}/>
                    <span style={{fontSize:12,fontWeight:700,color:'#555'}}>{col.label}</span>
                    <span style={{marginLeft:'auto',fontSize:10,fontWeight:700,background:'#e0e0e5',color:'#888',borderRadius:99,padding:'1px 6px'}}>{colItems.length}</span>
                  </div>
                  <div style={{overflowY:'auto',flex:1,display:'flex',flexDirection:'column',gap:8}}>
                    {colItems.length===0&&<p style={{textAlign:'center',color:'#ccc',fontSize:12,paddingTop:16}}>Vazio</p>}
                    {colItems.map(item=>(
                      <div key={item.id} style={{background:'#fff',borderRadius:12,padding:'10px',boxShadow:'0 1px 4px rgba(0,0,0,.07)',borderTop:`3px solid ${getSub(item.materia).color}`}}>
                        <p style={{fontSize:12,fontWeight:600,color:'#111',marginBottom:6,lineHeight:1.35}}>{item.titulo}</p>
                        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                          <SubChip materia={item.materia} small/>
                          <div style={{display:'flex',alignItems:'center',gap:4}}>
                            {item.dataVenc&&<span style={{fontSize:9,color:'#bbb'}}>{item.dataVenc}</span>}
                            <Avatar owner={item.filho} size={18}/>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
};

// CALENDAR SCREEN
// ═══════════════════════════════════════════════════════════════
const CalendarScreen=({itens})=>{
  const [viewDate,setViewDate]=useState(new Date());
  const [selected,setSelected]=useState(new Date().getDate());

  const ano=viewDate.getFullYear();
  const mes=viewDate.getMonth();
  const primeiroDia=new Date(ano,mes,1).getDay();
  const diasNoMes=new Date(ano,mes+1,0).getDate();
  const cells=[];
  for(let i=0;i<primeiroDia;i++)cells.push(null);
  for(let d=1;d<=diasNoMes;d++)cells.push(d);

  const itensMes=itens.filter(i=>{
    const dt=parseDate(i.dataVenc);
    return dt&&dt.getMonth()===mes&&dt.getFullYear()===ano;
  });

  const itensDia=(d)=>itensMes.filter(i=>parseDate(i.dataVenc)?.getDate()===d);
  const selectedItems=itensDia(selected);
  const hojeD=new Date();

  const prevMes=()=>{setViewDate(new Date(ano,mes-1,1));setSelected(1);};
  const nextMes=()=>{setViewDate(new Date(ano,mes+1,1));setSelected(1);};

  return(
    <div className="fade" style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
      <div style={{padding:'16px 20px 12px',flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
          <button onClick={prevMes} style={{background:'#f0f0f2',border:'none',borderRadius:10,width:34,height:34,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 11L5 7l4-4" stroke="#555" strokeWidth="1.8" strokeLinecap="round"/></svg>
          </button>
          <div style={{textAlign:'center'}}>
            <h1 style={{fontSize:20,fontWeight:800,color:'#111'}}>{MESES_PT[mes]}</h1>
            <p style={{fontSize:12,color:'#aaa',fontWeight:500}}>{ano}</p>
          </div>
          <button onClick={nextMes} style={{background:'#f0f0f2',border:'none',borderRadius:10,width:34,height:34,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5 3l4 4-4 4" stroke="#555" strokeWidth="1.8" strokeLinecap="round"/></svg>
          </button>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',marginBottom:6}}>
          {['D','S','T','Q','Q','S','S'].map((d,i)=><div key={i} style={{textAlign:'center',fontSize:11,fontWeight:700,color:'#bbb'}}>{d}</div>)}
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:'3px 0'}}>
          {cells.map((d,i)=>{
            if(!d)return<div key={i}/>;
            const isToday=d===hojeD.getDate()&&mes===hojeD.getMonth()&&ano===hojeD.getFullYear();
            const isSel=d===selected;
            const evs=itensDia(d);
            return(
              <div key={i} onClick={()=>setSelected(d)} style={{cursor:'pointer',padding:'2px'}}>
                <div style={{width:34,height:34,borderRadius:17,margin:'0 auto',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',background:isSel?ACCENT:isToday?ACCENT+'22':'transparent',transition:'background .15s'}}>
                  <span style={{fontSize:13,fontWeight:isToday||isSel?700:500,color:isSel?'#fff':isToday?ACCENT:'#333',lineHeight:1}}>{d}</span>
                  {evs.length>0&&!isSel&&(
                    <div style={{display:'flex',gap:2,marginTop:1}}>
                      {evs.slice(0,3).map((e,ei)=><div key={ei} style={{width:4,height:4,borderRadius:2,background:getSub(e.materia).color}}/>)}
                    </div>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      </div>
      <div style={{flex:1,overflowY:'auto',padding:'0 20px'}}>
        <h2 style={{fontSize:14,fontWeight:700,color:'#111',marginBottom:10}}>
          {selected===hojeD.getDate()&&mes===hojeD.getMonth()?'Hoje':'Dia '+selected} — {selectedItems.length} {selectedItems.length===1?'item':'itens'}
        </h2>
        {selectedItems.length===0&&<EmptyState emoji="📅" msg="Nenhum item neste dia"/>}
        {selectedItems.map(item=>{
          const s=getSub(item.materia);
          return(
            <div key={item.id} style={{background:'#fff',borderRadius:14,padding:'12px 14px',marginBottom:8,display:'flex',alignItems:'center',gap:12,boxShadow:'0 1px 4px rgba(0,0,0,.06)',borderLeft:`3px solid ${s.color}`}}>
              <div style={{flex:1}}>
                <p style={{fontSize:13,fontWeight:600,color:'#111',marginBottom:4}}>{item.titulo}</p>
                <div style={{display:'flex',gap:6,alignItems:'center'}}><SubChip materia={item.materia} small/><Avatar owner={item.filho} size={18}/></div>
              </div>
            </div>
          );
        })}
        {itensMes.filter(i=>parseDate(i.dataVenc)?.getDate()>selected).sort((a,b)=>parseDate(a.dataVenc)-parseDate(b.dataVenc)).length>0&&(
          <>
            <h2 style={{fontSize:14,fontWeight:700,color:'#111',margin:'16px 0 10px'}}>Próximos no mês</h2>
            {itensMes.filter(i=>parseDate(i.dataVenc)?.getDate()>selected).sort((a,b)=>parseDate(a.dataVenc)-parseDate(b.dataVenc)).slice(0,6).map(item=>{
              const s=getSub(item.materia);

// ── Hook: detecta SW update ────────────────────────────────────
const useSwUpdate = () => {
  const [ready, setReady] = useState(window.__swUpdateReady || false);
  useEffect(() => {
    const handler = () => setReady(true);
    document.addEventListener('swUpdateReady', handler);
    return () => document.removeEventListener('swUpdateReady', handler);
  }, []);
  const applyUpdate = () => {
    navigator.serviceWorker.getRegistration().then(reg => {
      if (reg && reg.waiting) {
        reg.waiting.postMessage({ type: 'SKIP_WAITING' });
      } else {
        window.location.reload();
      }
    });
  };
  return { ready, applyUpdate };
};

  const [syncLoading,setSyncLoading]=useState(false);
  const [error,setError]=useState(null);
  const [showAdd,setShowAdd]=useState(false);
  const [addLoading,setAddLoading]=useState(false);
  const [showMais,setShowMais]=useState(false);
  const [toast,setToast]=useState(null);

  const showToast=(msg,type='ok')=>{
    setToast({msg,type});
    setTimeout(()=>setToast(null),2500);
  };

  const fetchData=useCallback(async(silent=false)=>{
    if(!silent)setLoading(true);
    else setSyncLoading(true);
    setError(null);
    try{
      const data=await apiGet();
      setItens(data.itens||[]);
      setNotas(data.notas||[]);
      setComunicados((data.comunicados||[]).map(c=>({...c,_lido:false})));
      if(silent)showToast('Sincronizado ✓');
    }catch(e){
      if(!silent)setError(e.message);
      else showToast('Erro ao sincronizar','err');
    }finally{
      setLoading(false);
      setSyncLoading(false);
    }
  },[]);

  useEffect(()=>{fetchData();},[]);

  const handleToggle=async(item)=>{
    const newStatus=item.status==='concluido'||item.status==='concluído'?'pendente':'concluido';
    setItens(its=>its.map(i=>i.id===item.id?{...i,status:newStatus}:i));
    try{await apiUpdate('Itens',item.id,{status:newStatus});}
    catch(e){setItens(its=>its.map(i=>i.id===item.id?{...i,status:item.status}:i));showToast('Erro ao atualizar','err');}
  };

  const handleDelete=async(aba,id)=>{
    if(aba==='Itens'){setItens(its=>its.filter(i=>i.id!==id));}
    else{setComunicados(cs=>cs.filter(c=>c.id!==id));}
    try{await apiDelete(aba,id);showToast('Excluído');}
    catch(e){fetchData(true);showToast('Erro ao excluir','err');}
  };

  const handleDeleteCom=(id)=>handleDelete('Comunicados',id);

  const handleAdd=async(tipo,dados)=>{
    setAddLoading(true);
    try{
      const aba=tipo==='item'?'Itens':'Comunicados';
      const res=await apiAdd(aba,dados);
      await fetchData(true);
      setShowAdd(false);
      showToast('Adicionado ✓');
    }catch(e){showToast('Erro: '+e.message,'err');}
    finally{setAddLoading(false);}
  };

  const handleWA=async()=>{
    const {wa}=getConfig();
    try{
      const data=await apiGet();
      const itens2=data.itens||[];
      const MESES2=['','Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
      const toDate=s=>{const p=s.split('/');return new Date(p[2],p[1]-1,p[0]);};
      const nowD=new Date();
      const pendentes=itens2.filter(i=>i.status!=='concluido'&&i.status!=='concluído');
      const semData=pendentes.filter(i=>!i.dataVenc);
      const limite=addDays(nowD,30);
      const proximos=pendentes.filter(i=>{if(!i.dataVenc)return false;const d=toDate(i.dataVenc);return d>=nowD&&d<=limite;}).sort((a,b)=>toDate(a.dataVenc)-toDate(b.dataVenc));
      let texto=`📝 AGENDA MÁXIMUS\n${hoje()}\n`;
      if(semData.length>0){texto+=`\n⭕ PENDÊNCIAS SEM DATA\n`;semData.forEach(i=>{texto+=`⭕ ${i.filho.toUpperCase()}: ${i.titulo} (${i.materia})\n`;});}
      let mesAtual='';
      proximos.forEach(i=>{const p=i.dataVenc.split('/');const mes=MESES2[parseInt(p[1])];if(mes!==mesAtual){texto+=`\n🗓️ ${mes.toUpperCase()}\n`;mesAtual=mes;}const e=i.tipo==='prova'?'📝':'📌';texto+=`${e} ${i.dataVenc} — ${i.titulo} (${i.materia}) · ${i.filho==='iza'?'Iza':'Israel'}\n`;});
      if(proximos.length===0&&semData.length===0)texto+='✅ Nada pendente nos próximos 30 dias!';
      const url=`https://wa.me/${wa||''}?text=${encodeURIComponent(texto)}`;
      window.open(url,'_blank');
    }catch(e){showToast('Erro ao gerar resumo','err');}
  };

  const navScreens=['home','tasks','calendar','avisos'];
  const showNav=navScreens.includes(screen);
  const showFab=navScreens.includes(screen)&&screen!=='avisos';
  const unread=comunicados.filter(c=>!c._lido).length;

  const handleNav=(id)=>{
    if(id==='mais'){setShowMais(true);}
    else{setScreen(id);setShowMais(false);}
  };

  const handleMaisSelect=(id)=>{setScreen(id);setShowMais(false);};

  if(loading){
    return(
      <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',background:'#f5f5f7'}}>
        <div style={{width:60,height:60,borderRadius:18,background:ACCENT,display:'flex',alignItems:'center',justifyContent:'center',marginBottom:20,boxShadow:`0 8px 24px ${ACCENT}55`}}>
          <span style={{fontSize:28}}>📚</span>
        </div>
        <h1 style={{fontSize:20,fontWeight:800,color:'#111',marginBottom:8}}>Agenda Máximus</h1>
        <div style={{width:32,height:32,border:`3px solid #e5e7eb`,borderTop:`3px solid ${ACCENT}`,borderRadius:'50%',animation:'spin 0.8s linear infinite'}}/>
        <p style={{fontSize:12,color:'#aaa',marginTop:12}}>Carregando dados…</p>
      </div>
    );
  }

  if(error){
    return(
      <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',background:'#f5f5f7',padding:32,textAlign:'center'}}>
        <span style={{fontSize:48,marginBottom:16}}>⚠️</span>
        <h2 style={{fontSize:18,fontWeight:800,color:'#111',marginBottom:8}}>Erro ao carregar</h2>
        <p style={{fontSize:13,color:'#888',marginBottom:20,lineHeight:1.6}}>{error}</p>
        <p style={{fontSize:12,color:'#aaa',marginBottom:20}}>Verifique a URL do Apps Script e o token nas Configurações.</p>
        <button onClick={()=>fetchData()} style={{padding:'12px 28px',background:ACCENT,color:'#fff',border:'none',borderRadius:12,fontSize:14,fontWeight:700,cursor:'pointer',marginBottom:10}}>Tentar novamente</button>
        <button onClick={()=>{setError(null);setScreen('configs');}} style={{padding:'12px 28px',background:'#fff',color:'#555',border:'1.5px solid #e0e0e0',borderRadius:12,fontSize:14,fontWeight:600,cursor:'pointer'}}>Abrir Configurações</button>
      </div>
    );
  }

  return(
    <div style={{flex:1,display:'flex',flexDirection:'column',background:'#f5f5f7',overflow:'hidden',position:'relative'}}>
      {/* SW Update banner */}
      {swReady&&<UpdateBanner applyUpdate={applyUpdate}/>}

      {/* Sync indicator */}
      {syncLoading&&(
        <div style={{position:'fixed',top:0,left:0,right:0,height:3,background:`${ACCENT}22`,zIndex:200}}>
          <div style={{height:'100%',background:ACCENT,animation:'slideRight .6s ease',width:'60%'}}/>
        </div>
      )}

      {/* Screens */}
      <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
        {screen==='home'&&<HomeScreen itens={itens} comunicados={comunicados} setScreen={(s)=>{setShowMais(false);setScreen(s);}} onWA={handleWA}/>}
        {screen==='tasks'&&<TasksScreen itens={itens} onToggle={handleToggle} onDelete={handleDelete} loading={syncLoading}/>}
        {screen==='calendar'&&<CalendarScreen itens={itens}/>}
        {screen==='avisos'&&<AvisosScreen comunicados={comunicados} setComunicados={setComunicados} onDeleteCom={handleDeleteCom}/>}
        {screen==='boletim'&&<BoletimScreen notas={notas} setScreen={setScreen}/>}
        {screen==='horario'&&<HorarioScreen setScreen={setScreen}/>}
        {screen==='configs'&&<ConfigsScreen setScreen={setScreen} onSync={()=>fetchData(true)}/>}
      </div>

      {/* Bottom nav */}
      {showNav&&<BottomNav screen={screen} setScreen={handleNav} unread={unread}/>}

      {/* FAB */}
      {showFab&&<FAB onPress={()=>setShowAdd(true)}/>}

      {/* Mais overlay */}
      {showMais&&<MaisMenu setScreen={handleMaisSelect} onClose={()=>setShowMais(false)}/>}

      {/* Add modal */}
      {showAdd&&<AddModal onClose={()=>setShowAdd(false)} onSave={handleAdd} loading={addLoading}/>}

      {/* Toast */}
      {toast&&(
        <div className="slideUp" style={{position:'fixed',bottom:`calc(90px + env(safe-area-inset-bottom,0px))`,left:'50%',transform:'translateX(-50%)',background:toast.type==='err'?'#DC2626':'#111',color:'#fff',padding:'10px 20px',borderRadius:24,fontSize:13,fontWeight:600,zIndex:300,whiteSpace:'nowrap',boxShadow:'0 4px 16px rgba(0,0,0,.2)'}}>
          {toast.msg}
        </div>
      )}
    </div>
  );
};

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>

<script>
// ── Service Worker: registro e detecção de atualização ──────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      // Verifica atualização a cada vez que o app abre
      reg.update();

      // Quando uma nova versão do SW está esperando para ativar
      reg.addEventListener('updatefound', () => {
        const newWorker = reg.installing;
        newWorker.addEventListener('statechange', () => {
          if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
            // Há uma nova versão disponível — notifica o React
            window.__swUpdateReady = true;
            document.dispatchEvent(new CustomEvent('swUpdateReady'));
          }
        });
      });
    }).catch(err => console.warn('SW registro falhou:', err));

    // Se o SW foi atualizado em outra aba, recarrega esta
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      window.location.reload();
    });
  });
}
</script>
</body>
</html>

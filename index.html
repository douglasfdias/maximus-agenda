// ─── DATE HELPERS ─────────────────────────────────────────────
function fmtDate(d){return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;}
function hoje(){return fmtDate(new Date());}
function parseDate(s){if(!s)return null;const p=s.split('/');if(p.length!==3)return null;return new Date(p[2],p[1]-1,p[0]);}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function toISO(s){if(!s)return'';const p=s.split('/');if(p.length!==3)return'';return`${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`;}
function fromISO(s){if(!s)return'';const d=new Date(s+'T12:00:00');return isNaN(d)?'':fmtDate(d);}
function getMonday(d=new Date()){const r=new Date(d);const day=r.getDay();const diff=day===0?-6:1-day;r.setDate(r.getDate()+diff);r.setHours(0,0,0,0);return r;}

// ─── API ──────────────────────────────────────────────────────
function getConfig(){return{apiUrl:localStorage.getItem('mm_apiUrl')||DEFAULT_API,token:localStorage.getItem('mm_token')||'',wa:localStorage.getItem('mm_wa')||''};}
function saveConfig(c){localStorage.setItem('mm_apiUrl',c.apiUrl||DEFAULT_API);localStorage.setItem('mm_token',c.token||'');localStorage.setItem('mm_wa',c.wa||'');}

function apiFetch(params={}){
  const {apiUrl,token}=getConfig();
  const url=`${apiUrl}?${new URLSearchParams({token,...params})}`;
  return new Promise((resolve,reject)=>{
    const xhr=new XMLHttpRequest();
    xhr.open('GET',url,true);
    xhr.onload=()=>{
      try{const j=JSON.parse(xhr.responseText);j.ok?resolve(j):reject(new Error(j.erro||'Erro'));}
      catch(e){reject(new Error('Resposta inválida'));}
    };
    xhr.onerror=()=>reject(new Error('Sem acesso ao servidor. Verifique a URL nas Configurações.'));
    xhr.ontimeout=()=>reject(new Error('Timeout (30s)'));
    xhr.timeout=30000;
    xhr.send();
  });
}
const apiGet   =()=>apiFetch({acao:'get'});
const apiAdd   =(aba,d)=>apiFetch({acao:'add',aba,dados:encodeURIComponent(JSON.stringify(d))});
const apiUpdate=(aba,id,d)=>apiFetch({acao:'update',aba,id,dados:encodeURIComponent(JSON.stringify(d))});
const apiDelete=(aba,id)=>apiFetch({acao:'delete',aba,id});

// ─── HOOKS ────────────────────────────────────────────────────
const useSwUpdate=()=>{
  const [ready,setReady]=useState(window.__swUpdateReady||false);
  useEffect(()=>{const h=()=>setReady(true);document.addEventListener('swUpdateReady',h);return()=>document.removeEventListener('swUpdateReady',h);},[]);
  const apply=()=>navigator.serviceWorker?.getRegistration().then(r=>{r?.waiting?.postMessage({type:'SKIP_WAITING'})||window.location.reload();});
  return{ready,apply};
};

// Long press: 500ms hold = preview; quick tap = open
function useLongPress(onTap,onLong,delay=500){
  const timer=useRef(null);
  const fired=useRef(false);
  return{
    onTouchStart:()=>{fired.current=false;timer.current=setTimeout(()=>{fired.current=true;onLong();},delay);},
    onTouchEnd:()=>{clearTimeout(timer.current);if(!fired.current)onTap();},
    onTouchMove:()=>clearTimeout(timer.current),
    onContextMenu:(e)=>e.preventDefault(),
  };
}

const HomeScreen=({itens,comunicados,setScreen,setTasksFilter,onWA})=>{

  const pendentes=itens.filter(i=>i.status!=='concluido'&&i.status!=='cancelado');

          <p style={{fontSize:12,color:'rgba(255,255,255,.85)',fontWeight:500}}>Tarefas pendentes</p>

  </div>;

// TASKS SCREEN

const TasksScreen=({itens,onToggle,onEdit,onDelete,initialFilter={}})=>{
  const [view,setView]=useState('list');
  const [filho,setFilho]=useState(initialFilter.filho||'all');
  const [statusF,setStatusF]=useState(initialFilter.status||'pendente');
  const [materiaF,setMateriaF]=useState('all');
  const [etapaF,setEtapaF]=useState('all');
  const [sort,setSort]=useState('data');
  const [showFilters,setShowFilters]=useState(false);
  const [detail,setDetail]=useState(null);

  if(detail)return<ItemDetalhe item={detail} onClose={()=>setDetail(null)} onEdit={item=>{setDetail(null);onEdit(item);}} onDelete={item=>{setDetail(null);onDelete(item);}}/>;

  const filtered=itens.filter(i=>{
    const isPend=i.status!=='concluido'&&i.status!=='cancelado';
    const matchF=filho==='all'||i.filho===filho||i.filho==='ambos';
    const matchS=statusF==='pendente'?isPend:!isPend;
    const matchM=materiaF==='all'||i.materia===materiaF;
    const matchE=etapaF==='all'||i.etapa===etapaF;
    return matchF&&matchS&&matchM&&matchE;
  }).sort((a,b)=>{
    if(sort==='data'){const da=parseDate(a.dataVenc)||new Date(9999,0);const db=parseDate(b.dataVenc)||new Date(9999,0);return da-db;}
    if(sort==='datadesc'){const da=parseDate(a.dataVenc)||new Date(0);const db=parseDate(b.dataVenc)||new Date(0);return db-da;}

        </div>
        <div><p style={{fontSize:10,fontWeight:700,color:'#aaa',marginBottom:4}}>ETAPA</p><div style={{display:'flex',gap:4}}>{[['all','Todas'],['1','1ª'],['2','2ª'],['3','3ª']].map(([v,l])=><button key={v} onClick={()=>setEtapaF(v)} style={{flex:1,padding:'5px 0',borderRadius:8,background:etapaF===v?'#1E3A5F':'#f5f5f7',border:'none',cursor:'pointer',fontSize:11,fontWeight:700,color:etapaF===v?'#fff':'#888'}}>{l}</button>)}</div></div>
        <div><p style={{fontSize:10,fontWeight:700,color:'#aaa',marginBottom:4}}>MATÉRIA</p>

            <option value="all">Todas as matérias</option>

        </div>
        <div><p style={{fontSize:10,fontWeight:700,color:'#aaa',marginBottom:4}}>ORDENAR</p><div style={{display:'flex',gap:4,flexWrap:'wrap'}}>{[['data','Data ↑'],['datadesc','Data ↓'],['materia','Matéria'],['filho','Filho']].map(([v,l])=><button key={v} onClick={()=>setSort(v)} style={{padding:'5px 10px',borderRadius:8,background:sort===v?ACCENT:'#f5f5f7',border:'none',cursor:'pointer',fontSize:11,fontWeight:700,color:sort===v?'#fff':'#888'}}>{l}</button>)}</div></div>

// CALENDAR SCREEN
// ═══════════════════════════════════════════════════════════════
const CalendarScreen=({itens,onEdit,onDelete})=>{
  const [vd,setVd]=useState(new Date());
  const [sel,setSel]=useState(new Date().getDate());
  const [detail,setDetail]=useState(null);
  const ano=vd.getFullYear(),mes=vd.getMonth();
  const cells=[];
  for(let i=0;i<new Date(ano,mes,1).getDay();i++)cells.push(null);
  for(let d=1;d<=new Date(ano,mes+1,0).getDate();d++)cells.push(d);
  const itensMes=itens.filter(i=>{const d=parseDate(i.dataVenc);return d&&d.getMonth()===mes&&d.getFullYear()===ano;});
  const itensDia=d=>itensMes.filter(i=>parseDate(i.dataVenc)?.getDate()===d);
  const hj=new Date();

  if(detail)return<ItemDetalhe item={detail} onClose={()=>setDetail(null)} onEdit={item=>{setDetail(null);onEdit(item);}} onDelete={item=>{setDetail(null);onDelete(item);}}/>;

  return<div className="fade" style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
    <div style={{padding:'14px 20px 10px',flexShrink:0}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
        <button onClick={()=>{setVd(new Date(ano,mes-1,1));setSel(1);}} style={{background:'#f0f0f2',border:'none',borderRadius:10,width:34,height:34,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 11L5 7l4-4" stroke="#555" strokeWidth="1.8" strokeLinecap="round"/></svg></button>
        <div style={{textAlign:'center'}}><h1 style={{fontSize:20,fontWeight:800,color:'#111'}}>{MESES[mes]}</h1><p style={{fontSize:12,color:'#aaa',fontWeight:500}}>{ano}</p></div>
        <button onClick={()=>{setVd(new Date(ano,mes+1,1));setSel(1);}} style={{background:'#f0f0f2',border:'none',borderRadius:10,width:34,height:34,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5 3l4 4-4 4" stroke="#555" strokeWidth="1.8" strokeLinecap="round"/></svg></button>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',marginBottom:4}}>
        {['D','S','T','Q','Q','S','S'].map((d,i)=><div key={i} style={{textAlign:'center',fontSize:11,fontWeight:700,color:'#bbb'}}>{d}</div>)}
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:'2px 0'}}>
        {cells.map((d,i)=>{
          if(!d)return<div key={i}/>;
          const isToday=d===hj.getDate()&&mes===hj.getMonth()&&ano===hj.getFullYear();
          const isSel=d===sel;
          const evs=itensDia(d);
          return<div key={i} onClick={()=>setSel(d)} style={{cursor:'pointer',padding:'1px'}}>
            <div style={{width:34,height:34,borderRadius:17,margin:'0 auto',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',background:isSel?ACCENT:isToday?ACCENT+'22':'transparent'}}>
              <span style={{fontSize:12,fontWeight:isToday||isSel?700:500,color:isSel?'#fff':isToday?ACCENT:'#333',lineHeight:1}}>{d}</span>
              {evs.length>0&&!isSel&&<div style={{display:'flex',gap:2,marginTop:1}}>{evs.slice(0,3).map((e,ei)=><div key={ei} style={{width:4,height:4,borderRadius:2,background:getSub(e.materia).color}}/>)}</div>}
            </div>
          </div>;
        })}
      </div>
    </div>
    <div style={{flex:1,overflowY:'auto',padding:'0 20px'}}>
      <p style={{fontSize:13,fontWeight:700,color:'#111',marginBottom:10}}>Dia {sel} — {itensDia(sel).length} {itensDia(sel).length===1?'item':'itens'}</p>
      {itensDia(sel).length===0?<EmptyState emoji="📅" msg="Nenhum item neste dia"/>:itensDia(sel).map(item=><ItemCard key={item.id} item={item} onPress={()=>setDetail(item)} onLongPress={()=>{}} onEdit={onEdit} onDelete={onDelete}/>)}
    </div>
  </div>;
};

// AVISOS SCREEN

const AvisosScreen=({comunicados,setComunicados,onArchive,onDelete,onEdit})=>{
  const [detail,setDetail]=useState(null);
  const [filho,setFilho]=useState('ambos');
  const [etiq,setEtiq]=useState('todos');
  const [verArq,setVerArq]=useState(false);

  const markLido=id=>setComunicados(cs=>cs.map(c=>c.id===id?{...c,_lido:true}:c));

  const filtered=comunicados.filter(c=>{
    const matchF=filho==='ambos'||c.filho==='ambos'||c.filho===filho;
    const matchE=etiq==='todos'||c.etiqueta===etiq;
    const matchArq=verArq?(c.arquivado==='sim'):(c.arquivado!=='sim');
    return matchF&&matchE&&matchArq;
  }).sort((a,b)=>{
    if(!verArq){if(a.etiqueta==='urgente'&&b.etiqueta!=='urgente')return-1;if(b.etiqueta==='urgente'&&a.etiqueta!=='urgente')return 1;}
    const da=parseDate(a.data)||new Date(0),db=parseDate(b.data)||new Date(0);
    return db-da;
  });

  const unread=filtered.filter(c=>!c._lido).length;

  if(detail){
    const t=getEtiq(detail.etiqueta);
    const isUrgente=detail.etiqueta==='urgente';
    return<div className="slideRight" style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
      <div style={{padding:'14px 20px 10px',display:'flex',alignItems:'center',gap:10,background:'#fff',borderBottom:'1px solid #f0f0f0',flexShrink:0}}>
        <BackBtn onPress={()=>setDetail(null)}/>
        <EtiqChip etiqueta={detail.etiqueta}/>
        <div style={{marginLeft:'auto',display:'flex',gap:6}}>
          <button onClick={()=>{setDetail(null);onEdit(detail);}} style={{background:'#f0f0f2',border:'none',borderRadius:10,padding:'6px 10px',cursor:'pointer',fontSize:11,fontWeight:700,color:'#555'}}>✏️ Editar</button>
          <button onClick={()=>{onArchive(detail.id);setDetail(null);}} style={{background:'#FFF7ED',border:'none',borderRadius:10,padding:'6px 10px',cursor:'pointer',fontSize:11,fontWeight:700,color:'#D97706'}}>📦 Arquivar</button>
        </div>
      </div>
      <div style={{flex:1,overflowY:'auto',padding:20,background:isUrgente?'#FFF5F5':'#f5f5f7'}}>
        {isUrgente&&<div style={{background:'#FEF2F2',border:'2px solid #DC2626',borderRadius:14,padding:'10px 14px',marginBottom:16,display:'flex',gap:8,alignItems:'center'}}><span className="pulse" style={{fontSize:18}}>🚨</span><span style={{fontSize:12,fontWeight:800,color:'#DC2626'}}>COMUNICADO URGENTE</span></div>}
        <p style={{fontSize:11,color:'#aaa',fontWeight:500,marginBottom:4}}>{detail.remetente}{detail.remetente&&' · '}{detail.data}</p>
        <h1 style={{fontSize:18,fontWeight:800,color:'#111',marginBottom:16,lineHeight:1.3}}>{detail.titulo}</h1>
        <div style={{background:'#fff',borderRadius:16,padding:16,boxShadow:'0 1px 4px rgba(0,0,0,.06)'}}>
          <p style={{fontSize:14,color:'#333',lineHeight:1.75,whiteSpace:'pre-wrap'}}>{detail.conteudo||'Sem conteúdo.'}</p>
        </div>
        <button onClick={()=>{onDelete(detail.id);setDetail(null);}} style={{marginTop:16,width:'100%',padding:'12px 0',background:'#FEF2F2',color:'#DC2626',border:'none',borderRadius:12,fontSize:13,fontWeight:700,cursor:'pointer'}}>🗑 Excluir comunicado</button>
      </div>
    </div>;
  }

  return<div className="fade" style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
    <div style={{padding:'14px 20px 8px',flexShrink:0}}>
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
        <h1 style={{fontSize:20,fontWeight:800,color:'#111'}}>Avisos</h1>
        {unread>0&&<div style={{background:ACCENT,color:'#fff',fontSize:11,fontWeight:700,borderRadius:99,padding:'2px 8px'}}>{unread}</div>}
        <button onClick={()=>setVerArq(v=>!v)} style={{marginLeft:'auto',background:verArq?'#1E3A5F':'#f0f0f2',border:'none',borderRadius:10,padding:'5px 10px',cursor:'pointer',fontSize:11,fontWeight:700,color:verArq?'#fff':'#888'}}>📦 {verArq?'Ver ativos':'Arquivados'}</button>
      </div>
      <div style={{display:'flex',background:'#ebebeb',borderRadius:14,padding:3,marginBottom:8}}>
        {[['ambos','Ambos'],['iza','Iza'],['israel','Israel']].map(([v,l])=><button key={v} onClick={()=>setFilho(v)} style={{flex:1,padding:'6px 0',borderRadius:10,background:filho===v?'#fff':'transparent',border:'none',cursor:'pointer',fontSize:12,fontWeight:700,color:filho===v?'#111':'#999',boxShadow:filho===v?'0 1px 6px rgba(0,0,0,.1)':'none',transition:'all .2s'}}>{l}</button>)}
      </div>
      <div style={{display:'flex',gap:5,overflowX:'auto',paddingBottom:4}}>
        {['todos',...Object.keys(ETIQ)].map(tipo=>{
          const t=getEtiq(tipo),active=etiq===tipo;
          return<button key={tipo} onClick={()=>setEtiq(tipo)} style={{padding:'5px 10px',borderRadius:99,flexShrink:0,background:active?(tipo==='urgente'?'#DC2626':t.c||ACCENT):'#fff',color:active?'#fff':(tipo==='urgente'?'#DC2626':t.c||'#666'),border:`1.5px solid ${tipo==='urgente'?'#DC2626':active?t.c||ACCENT:'#e0e0e0'}`,fontSize:10,fontWeight:700,cursor:'pointer'}}>

    <div style={{flex:1,overflowY:'auto',padding:'0 20px'}}>
      {filtered.length===0&&<EmptyState emoji={verArq?'📦':'🔕'} msg={verArq?'Nenhum comunicado arquivado':'Nenhum aviso encontrado'}/>}
      {filtered.map(item=>{
        const t=getEtiq(item.etiqueta);
        const isUrg=item.etiqueta==='urgente';
        return<div key={item.id} onClick={()=>{markLido(item.id);setDetail(item);}} style={{background:isUrg?'#FEF2F2':'#fff',borderRadius:14,padding:'12px 14px',marginBottom:8,display:'flex',alignItems:'flex-start',gap:10,boxShadow:'0 1px 4px rgba(0,0,0,.06)',cursor:'pointer',position:'relative',overflow:'hidden',border:isUrg?'1.5px solid #DC2626':'1.5px solid transparent'}}>
          {!item._lido&&<div style={{position:'absolute',left:0,top:0,bottom:0,width:3,background:isUrg?'#DC2626':ACCENT}}/>}
          <div style={{width:36,height:36,borderRadius:10,background:t.bg,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,position:'relative'}}>
            <span style={{fontSize:16}}>{t.e}</span>
            {isUrg&&<div className="pulse" style={{position:'absolute',top:-2,right:-2,width:8,height:8,borderRadius:4,background:'#DC2626',border:'2px solid #FEF2F2'}}/>}
          </div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:2}}>

        </div>;
      })}
    </div>
  </div>;
};

      </div>
      <div style={{display:'flex',gap:4}}>
        {[['all','Todas'],['1','1ª'],['2','2ª'],['3','3ª']].map(([v,l])=><button key={v} onClick={()=>setEtapaF(v)} style={{flex:1,padding:'6px 0',borderRadius:8,background:etapaF===v?'#1E3A5F':'#f0f0f2',border:'none',cursor:'pointer',fontSize:11,fontWeight:700,color:etapaF===v?'#fff':'#888'}}>{l}</button>)}
      </div>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'36px 1fr auto',padding:'6px 16px',background:'#1E3A5F',flexShrink:0,gap:4}}>
      {['Etapa','Avaliação','Nota'].map(h=><span key={h} style={{fontSize:11,fontWeight:700,color:'#fff'}}>{h}</span>)}
    </div>
    <div style={{flex:1,overflowY:'auto'}}>
      {grouped.length===0&&<EmptyState emoji="📊" msg="Nenhuma nota encontrada"/>}
      {grouped.map(([mat,etapas])=>{
        const s=getSub(mat);
        return<div key={mat}>
          <div style={{background:s.bg,borderLeft:`4px solid ${s.color}`,padding:'7px 16px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <span style={{fontSize:13,fontWeight:700,color:s.color}}>{s.label}</span>
          </div>
          {Object.entries(etapas).sort().map(([etapa,avs])=>{
            const numNotas=avs.filter(a=>!qualitativo(a.nota)&&a.nota!=='');
            const total=numNotas.reduce((s,a)=>s+parseFloat(a.nota||0),0);
            const media=MEDIA[parseInt(etapa)]||18;
            const max=MAX[parseInt(etapa)]||30;
            const totalOk=total>=media;
            return<div key={etapa}>
              {avs.map((av,i)=><div key={i} style={{display:'grid',gridTemplateColumns:'36px 1fr auto',padding:'7px 16px',gap:4,background:i%2===0?'#fff':'#fafafa',borderBottom:'1px solid #f0f0f0',alignItems:'center'}}>
                <span style={{fontSize:11,color:'#888',fontWeight:500}}>{av.etapa}ª</span>
                <div>
                  <span style={{fontSize:11,color:'#333',fontWeight:500}}>{av.atividade}</span>
                  {av.valor_atividade&&<span style={{fontSize:9,color:'#bbb',marginLeft:4}}>[{av.valor_atividade}]</span>}
                </div>
                <span style={{fontSize:13,fontWeight:700,color:notaCor(av.nota,parseFloat(av.valor_atividade||0),etapa),textAlign:'right'}}>{av.nota||'—'}</span>
              </div>)}
              {numNotas.length>0&&<div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'6px 16px',background:'#F8FAFF',borderBottom:'2px solid #e8edf5'}}>
                <span style={{fontSize:11,fontWeight:600,color:'#888'}}>Total {etapa}ª etapa · mín. {media}/{max}</span>
                <span style={{fontSize:14,fontWeight:800,color:totalOk?'#16A34A':'#DC2626'}}>{total.toFixed(2)}{!totalOk&&' ⚠'}</span>
              </div>}
            </div>;
          })}
        </div>;
      })}
    </div>
  </div>;
};

const ProvasScreen=({itens,notas,onToggle,onEdit,onDelete,setScreen})=>{
  const [view,setView]=useState('agenda');
  const [filho,setFilho]=useState('all');
  const [etapaF,setEtapaF]=useState('all');
  const [detail,setDetail]=useState(null);
  const now=new Date();now.setHours(0,0,0,0);
  const mon=getMonday();
  const sun=addDays(mon,6);
  const mon2=addDays(mon,7);
  const sun2=addDays(mon,13);

  // Provas futuras (de itens)
  const provasFuturas=itens.filter(i=>i.tipo==='prova'&&(filho==='all'||i.filho===filho||i.filho==='ambos')&&(etapaF==='all'||i.etapa===etapaF));
  // Provas passadas (de notas)
  const provasPassadas=notas.filter(n=>n.atividade?.includes('PROVA')&&(filho==='all'||n.filho===filho)&&(etapaF==='all'||n.etapa===etapaF));

  if(detail)return<ItemDetalhe item={detail} onClose={()=>setDetail(null)} onEdit={item=>{setDetail(null);onEdit(item);}} onDelete={item=>{setDetail(null);onDelete(item);}}/>;

  const ProvaFuturaCard=({item})=>{
    const s=getSub(item.materia);
    const d=parseDate(item.dataVenc);
    const done=item.status==='concluido';
    return<div onClick={()=>setDetail(item)} style={{background:done?'#F0FDF4':'#fff',borderRadius:14,padding:'12px 14px',marginBottom:8,display:'flex',gap:12,alignItems:'center',boxShadow:'0 1px 4px rgba(0,0,0,.06)',borderLeft:`3px solid ${s.color}`,cursor:'pointer',opacity:done?.7:1}}>
      {d&&<div style={{width:44,height:44,borderRadius:12,background:s.bg,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',flexShrink:0}}>
        <span style={{fontSize:14,fontWeight:800,color:s.color,lineHeight:1}}>{d.getDate()}</span>
        <span style={{fontSize:9,color:s.color,opacity:.7}}>{DIAS[d.getDay()]}</span>
      </div>}
      <div style={{flex:1,minWidth:0}}>
        <p style={{fontSize:13,fontWeight:600,color:'#111',marginBottom:3,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{item.titulo}</p>
        <div style={{display:'flex',gap:5,alignItems:'center'}}><SubChip materia={item.materia} small/>{item.etapa&&<span style={{fontSize:9,fontWeight:600,background:'#e8edf5',color:'#1E3A5F',borderRadius:20,padding:'1px 5px'}}>{item.etapa}ª</span>}<Avatar owner={item.filho} size={16}/></div>
      </div>
      <button onClick={e=>{e.stopPropagation();onToggle(item);}} style={{width:24,height:24,borderRadius:12,background:done?ACCENT:'transparent',border:`2px solid ${done?ACCENT:'#ccc'}`,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',padding:0,flexShrink:0}}>
        {done&&<svg width="11" height="11" viewBox="0 0 11 11"><polyline points="2,5.5 4.5,8 9,3" stroke="#fff" strokeWidth="1.8" fill="none" strokeLinecap="round"/></svg>}
      </button>
    </div>;
  };

  const WeekBlock=({title,start,end,highlight})=>{
    const dias=[];for(let d=new Date(start);d<=end;d=addDays(d,1))dias.push(new Date(d));
    const hasProvas=dias.some(d=>provasFuturas.some(p=>{const pd=parseDate(p.dataVenc);return pd&&fmtDate(pd)===fmtDate(d);}));
    if(!hasProvas&&!highlight)return<div style={{background:'#f0f0f2',borderRadius:14,padding:'12px 14px',marginBottom:10}}><p style={{fontSize:12,fontWeight:600,color:'#bbb',textAlign:'center'}}>{title} — nenhuma prova 🎉</p></div>;
    return<div style={{marginBottom:12}}>
      <p style={{fontSize:12,fontWeight:700,color:'#1E3A5F',marginBottom:8,padding:'0 4px'}}>{title}</p>
      {dias.map(d=>{
        const ds=fmtDate(d);
        const dProvas=provasFuturas.filter(p=>parseDate(p.dataVenc)&&fmtDate(parseDate(p.dataVenc))===ds);
        if(!dProvas.length)return null;
        const isToday=ds===hoje();
        return<div key={ds}>
          <div style={{display:'flex',alignItems:'center',gap:6,margin:'6px 0 4px'}}>
            <div style={{width:24,height:24,borderRadius:12,background:isToday?ACCENT:'#e8edf5',display:'flex',alignItems:'center',justifyContent:'center'}}><span style={{fontSize:10,fontWeight:700,color:isToday?'#fff':'#1E3A5F'}}>{d.getDate()}</span></div>
            <span style={{fontSize:11,fontWeight:600,color:isToday?ACCENT:'#666'}}>{DIAS[d.getDay()]}{isToday?' · Hoje':''}</span>
          </div>
          {dProvas.map(p=><ProvaFuturaCard key={p.id} item={p}/>)}
        </div>;
      })}
    </div>;
  };

  const allSorted=[...provasFuturas].sort((a,b)=>{
    const da=parseDate(a.dataVenc)||new Date(9999,0);
    const db=parseDate(b.dataVenc)||new Date(9999,0);
    return da-db;
  });

  return<div className="slideRight" style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
    <div style={{padding:'14px 20px 8px',flexShrink:0}}>
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10}}>
        <BackBtn onPress={()=>setScreen('home')}/>
        <h1 style={{fontSize:20,fontWeight:800,color:'#111'}}>Provas</h1>
      </div>
      <div style={{display:'flex',background:'#ebebeb',borderRadius:12,padding:3,marginBottom:8}}>
        {[['agenda','📅 Agenda'],['lista','📋 Lista']].map(([v,l])=><button key={v} onClick={()=>setView(v)} style={{flex:1,padding:'6px 0',borderRadius:9,background:view===v?'#fff':'transparent',border:'none',cursor:'pointer',fontSize:12,fontWeight:700,color:view===v?'#111':'#999',boxShadow:view===v?'0 1px 4px rgba(0,0,0,.1)':'none',transition:'all .2s'}}>{l}</button>)}
      </div>
      <div style={{display:'flex',gap:6}}>
        <div style={{display:'flex',gap:4,flex:1}}>
          {[['all','Todos'],['iza','Iza'],['israel','Israel']].map(([v,l])=><button key={v} onClick={()=>setFilho(v)} style={{flex:1,padding:'5px 0',borderRadius:8,background:filho===v?ACCENT:'#f0f0f2',border:'none',cursor:'pointer',fontSize:11,fontWeight:700,color:filho===v?'#fff':'#888'}}>{l}</button>)}
        </div>
        <div style={{display:'flex',gap:4}}>
          {[['all','Todas'],['1','1ª'],['2','2ª'],['3','3ª']].map(([v,l])=><button key={v} onClick={()=>setEtapaF(v)} style={{padding:'5px 8px',borderRadius:8,background:etapaF===v?'#1E3A5F':'#f0f0f2',border:'none',cursor:'pointer',fontSize:11,fontWeight:700,color:etapaF===v?'#fff':'#888'}}>{l}</button>)}
        </div>
      </div>
    </div>
    <div style={{flex:1,overflowY:'auto',padding:'0 20px'}}>
      {view==='agenda'?(<>
        <WeekBlock title={`Esta semana (${fmtDate(mon)} – ${fmtDate(sun)})`} start={mon} end={sun} highlight/>
        <WeekBlock title={`Próxima semana (${fmtDate(mon2)} – ${fmtDate(sun2)})`} start={mon2} end={sun2}/>
        {provasFuturas.filter(p=>{const d=parseDate(p.dataVenc);return d&&d>sun2;}).length>0&&<>
          <p style={{fontSize:12,fontWeight:700,color:'#1E3A5F',marginBottom:8,padding:'0 4px'}}>Próximas etapas</p>
          {provasFuturas.filter(p=>{const d=parseDate(p.dataVenc);return d&&d>sun2;}).sort((a,b)=>parseDate(a.dataVenc)-parseDate(b.dataVenc)).map(p=><ProvaFuturaCard key={p.id} item={p}/>)}
        </>}
        {provasFuturas.filter(p=>!p.dataVenc).length>0&&<>
          <p style={{fontSize:12,fontWeight:700,color:'#aaa',marginTop:8,marginBottom:8}}>Sem data definida</p>
          {provasFuturas.filter(p=>!p.dataVenc).map(p=><ProvaFuturaCard key={p.id} item={p}/>)}
        </>}
        {provasFuturas.length===0&&<EmptyState emoji="📝" msg="Nenhuma prova cadastrada"/>}
      </>):(
        <>
          {allSorted.length===0&&provasPassadas.length===0&&<EmptyState emoji="📝" msg="Nenhuma prova encontrada"/>}
          {allSorted.length>0&&<><p style={{fontSize:12,fontWeight:700,color:'#1E3A5F',marginBottom:8}}>Próximas</p>{allSorted.map(p=><ProvaFuturaCard key={p.id} item={p}/>)}</>}
          {provasPassadas.length>0&&<><p style={{fontSize:12,fontWeight:700,color:'#888',margin:'12px 0 8px'}}>Realizadas (boletim)</p>
            {provasPassadas.map((n,i)=>{const s=getSub(n.materia);return<div key={i} style={{background:'#fff',borderRadius:12,padding:'10px 14px',marginBottom:7,display:'flex',gap:10,alignItems:'center',boxShadow:'0 1px 4px rgba(0,0,0,.06)',borderLeft:`3px solid ${s.color}`}}>
              <div style={{flex:1}}><p style={{fontSize:12,fontWeight:600,color:'#555'}}>{n.atividade}</p><div style={{display:'flex',gap:5,alignItems:'center',marginTop:3}}><SubChip materia={n.materia} small/><span style={{fontSize:9,fontWeight:600,background:'#e8edf5',color:'#1E3A5F',borderRadius:20,padding:'1px 5px'}}>{n.etapa}ª</span><Avatar owner={n.filho} size={16}/></div></div>
              <span style={{fontSize:16,fontWeight:800,color:parseFloat(n.nota)>=(parseFloat(n.valor_atividade)*0.6)?'#16A34A':'#DC2626'}}>{n.nota}</span>
            </div>;})}
          </>}
        </>
      )}
    </div>
  </div>;
};

// ═══════════════════════════════════════════════════════════════
const App=()=>{
  const [screen,setScreen]=useState('home');
  const [itens,setItens]=useState([]);
  const [notas,setNotas]=useState([]);
  const [comunicados,setComunicados]=useState([]);
  const [loading,setLoading]=useState(true);
  const [syncLoading,setSyncLoading]=useState(false);
  const [error,setError]=useState(null);
  const [showAdd,setShowAdd]=useState(false);
  const [editItem,setEditItem]=useState(null);
  const [addLoading,setAddLoading]=useState(false);
  const [showMais,setShowMais]=useState(false);
  const [toast,setToast]=useState(null);
  const [confirm,setConfirm]=useState(null);
  const [longPress,setLongPress]=useState(null);
  const [tasksFilter,setTasksFilter]=useState({});
  const {ready:swReady,apply:applyUpdate}=useSwUpdate();

  const showToast=(msg,type='ok')=>{setToast({msg,type});setTimeout(()=>setToast(null),2500);};

  const fetchData=useCallback(async(silent=false)=>{
    if(!silent)setLoading(true); else setSyncLoading(true);
    setError(null);
    try{
      const data=await apiGet();
      setItens(data.itens||[]);
      setNotas(data.notas||[]);
      setComunicados((data.comunicados||[]).map(c=>({...c,_lido:false})));
      if(silent)showToast('Sincronizado ✓');
    }catch(e){if(!silent)setError(e.message);else showToast('Erro: '+e.message,'err');}
    finally{setLoading(false);setSyncLoading(false);}
  },[]);

  useEffect(()=>{fetchData();},[]);

  const handleToggle=async(item)=>{
    const ns=item.status==='concluido'?'pendente':'concluido';
    setItens(its=>its.map(i=>i.id===item.id?{...i,status:ns}:i));
    try{await apiUpdate('Itens',item.id,{status:ns});}
    catch(e){setItens(its=>its.map(i=>i.id===item.id?{...i,status:item.status}:i));showToast('Erro','err');}
  };

  const handleSaveItem=async(tipo,dados)=>{
    setAddLoading(true);
    try{
      if(editItem?.id){
        const aba=tipo==='item'?'Itens':'Comunicados';
        await apiUpdate(aba,editItem.id,dados);
      } else {
        await apiAdd(tipo==='item'?'Itens':'Comunicados',dados);
      }
      await fetchData(true);
      setShowAdd(false);setEditItem(null);
      showToast(editItem?'Atualizado ✓':'Adicionado ✓');
    }catch(e){showToast('Erro: '+e.message,'err');}
    finally{setAddLoading(false);}
  };

  const handleDeleteItem=(item)=>{
    setConfirm({msg:`Excluir "${item.titulo}"?`,onConfirm:async()=>{
      setConfirm(null);
      const aba=item.etiqueta!==undefined?'Comunicados':'Itens';
      setItens(its=>its.filter(i=>i.id!==item.id));
      setComunicados(cs=>cs.filter(c=>c.id!==item.id));
      try{await apiDelete(aba,item.id);showToast('Excluído');}
      catch(e){fetchData(true);showToast('Erro','err');}
    }});
  };

  const handleArchiveCom=async(id)=>{
    setComunicados(cs=>cs.map(c=>c.id===id?{...c,arquivado:'sim'}:c));
    try{await apiUpdate('Comunicados',id,{arquivado:'sim'});showToast('Arquivado');}
    catch(e){fetchData(true);showToast('Erro','err');}
  };

  const handleDeleteCom=(id)=>{
    const com=comunicados.find(c=>c.id===id);
    setConfirm({msg:`Excluir "${com?.titulo}"?`,onConfirm:async()=>{
      setConfirm(null);
      setComunicados(cs=>cs.filter(c=>c.id!==id));
      try{await apiDelete('Comunicados',id);showToast('Excluído');}
      catch(e){fetchData(true);showToast('Erro','err');}
    }});
  };

  const handleWA=async()=>{
    const {wa}=getConfig();
    try{
      const data=await apiGet();
      const pend=(data.itens||[]).filter(i=>i.status!=='concluido'&&i.status!=='cancelado');
      const now=new Date();now.setHours(0,0,0,0);
      const atrasados=pend.filter(i=>{const d=parseDate(i.dataVenc);return d&&d<now;});
      const semData=pend.filter(i=>!i.dataVenc);
      const proximos=pend.filter(i=>{const d=parseDate(i.dataVenc);return d&&d>=now;}).sort((a,b)=>parseDate(a.dataVenc)-parseDate(b.dataVenc));
      let t=`📝 AGENDA MÁXIMUS\n${hoje()}\n`;
      if(atrasados.length){t+=`\n🔴 ATRASADOS\n`;atrasados.forEach(i=>{t+=`🔴 ${i.filho.toUpperCase()}: ${i.titulo} (${getSub(i.materia).label})\n`;});}
      if(semData.length){t+=`\n⭕ SEM DATA\n`;semData.forEach(i=>{t+=`⭕ ${i.titulo} (${getSub(i.materia).label}) · ${i.filho}\n`;});}
      let mesAtual='';
      proximos.forEach(i=>{const d=parseDate(i.dataVenc);const mes=MESES[d.getMonth()];if(mes!==mesAtual){t+=`\n🗓️ ${mes.toUpperCase()}\n`;mesAtual=mes;}t+=`${i.tipo==='prova'?'📝':'📌'} ${DIAS[d.getDay()]} ${i.dataVenc} — ${i.titulo} (${getSub(i.materia).label}) · ${i.filho}\n`;});
      if(!atrasados.length&&!semData.length&&!proximos.length)t+='✅ Nada pendente!';
      window.open(`https://wa.me/${wa||''}?text=${encodeURIComponent(t)}`,'_blank');
    }catch(e){showToast('Erro ao gerar resumo','err');}
  };

  const navScreens=['home','tasks','calendar','avisos'];
  const unread=comunicados.filter(c=>!c._lido&&c.arquivado!=='sim').length;

  const handleNav=id=>{if(id==='mais')setShowMais(true);else{setScreen(id);setShowMais(false);}};
  const handleSetScreen=id=>{setScreen(id);setShowMais(false);};

  if(loading)return<div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',background:'#f5f5f7'}}>
    <div style={{width:64,height:64,borderRadius:20,background:ACCENT,display:'flex',alignItems:'center',justifyContent:'center',marginBottom:20,boxShadow:`0 8px 24px ${ACCENT}55`}}><span style={{fontSize:30}}>📚</span></div>
    <h1 style={{fontSize:20,fontWeight:800,color:'#111',marginBottom:12}}>Agenda Máximus</h1>
    <div style={{width:32,height:32,border:'3px solid #e5e7eb',borderTop:`3px solid ${ACCENT}`,borderRadius:'50%',animation:'spin .8s linear infinite'}}/>
    <p style={{fontSize:12,color:'#aaa',marginTop:12}}>Carregando dados…</p>
  </div>;

  if(error)return<div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',background:'#f5f5f7',padding:32,textAlign:'center'}}>
    <span style={{fontSize:48,marginBottom:16}}>⚠️</span>
    <h2 style={{fontSize:18,fontWeight:800,color:'#111',marginBottom:8}}>Erro ao carregar</h2>
    <p style={{fontSize:13,color:'#888',marginBottom:8,lineHeight:1.6}}>{error}</p>
    <p style={{fontSize:11,color:'#ccc',marginBottom:20}}>⚠️ Ao reinstalar o app, as configurações são apagadas e precisam ser refeitas.</p>
    <button onClick={()=>fetchData()} style={{padding:'12px 28px',background:ACCENT,color:'#fff',border:'none',borderRadius:12,fontSize:14,fontWeight:700,cursor:'pointer',marginBottom:10}}>Tentar novamente</button>
    <button onClick={()=>{setError(null);setScreen('configs');}} style={{padding:'12px 28px',background:'#fff',color:'#555',border:'1.5px solid #e0e0e0',borderRadius:12,fontSize:14,fontWeight:600,cursor:'pointer'}}>Abrir Configurações</button>
  </div>;

  return<div style={{flex:1,display:'flex',flexDirection:'column',background:'#f5f5f7',overflow:'hidden',position:'relative'}}>
    {swReady&&<UpdateBanner apply={applyUpdate}/>}
    {syncLoading&&<div style={{position:'fixed',top:0,left:0,right:0,height:3,background:`${ACCENT}22`,zIndex:200}}><div style={{height:'100%',background:ACCENT,width:'70%',transition:'width .5s'}}/></div>}

    <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',paddingTop:swReady?40:0}}>
      {screen==='home'&&<HomeScreen itens={itens} comunicados={comunicados} setScreen={handleSetScreen} setTasksFilter={setTasksFilter} onWA={handleWA}/>}
      {screen==='tasks'&&<TasksScreen itens={itens} onToggle={handleToggle} onEdit={item=>{setEditItem(item);setShowAdd(true);}} onDelete={handleDeleteItem} initialFilter={tasksFilter}/>}
      {screen==='calendar'&&<CalendarScreen itens={itens} onEdit={item=>{setEditItem(item);setShowAdd(true);}} onDelete={handleDeleteItem}/>}
      {screen==='avisos'&&<AvisosScreen comunicados={comunicados} setComunicados={setComunicados} onArchive={handleArchiveCom} onDelete={handleDeleteCom} onEdit={item=>{setEditItem(item);setShowAdd(true);}}/>}
      {screen==='boletim'&&<BoletimScreen notas={notas} setScreen={handleSetScreen}/>}
      {screen==='provas'&&<ProvasScreen itens={itens} notas={notas} onToggle={handleToggle} onEdit={item=>{setEditItem(item);setShowAdd(true);}} onDelete={handleDeleteItem} setScreen={handleSetScreen}/>}
      {screen==='horario'&&<HorarioScreen setScreen={handleSetScreen}/>}
      {screen==='configs'&&<ConfigsScreen setScreen={handleSetScreen} onSync={()=>fetchData(true)}/>}
    </div>

    {navScreens.includes(screen)&&<BottomNav screen={screen} setScreen={handleNav} unread={unread}/>}
    {['home','tasks','calendar'].includes(screen)&&<FAB onPress={()=>{setEditItem(null);setShowAdd(true);}}/>}
    {showMais&&<MaisMenu setScreen={handleSetScreen} onClose={()=>setShowMais(false)}/>}
    {(showAdd||editItem)&&<AddEditModal item={editItem} onClose={()=>{setShowAdd(false);setEditItem(null);}} onSave={handleSaveItem} loading={addLoading}/>}
    {confirm&&<ConfirmModal msg={confirm.msg} onConfirm={confirm.onConfirm} onCancel={()=>setConfirm(null)} confirmLabel="Excluir"/>}
    {longPress&&<LongPressOverlay item={longPress} onClose={()=>setLongPress(null)}/>}
    {toast&&<div className="slideUp" style={{position:'fixed',bottom:'calc(90px + env(safe-area-inset-bottom,0px))',left:'50%',transform:'translateX(-50%)',background:toast.type==='err'?'#DC2626':'#111',color:'#fff',padding:'10px 20px',borderRadius:24,fontSize:13,fontWeight:600,zIndex:300,whiteSpace:'nowrap',boxShadow:'0 4px 16px rgba(0,0,0,.2)'}}>{toast.msg}</div>}
  </div>;
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<script>
if('serviceWorker'in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').then(reg=>{
      reg.update();
      reg.addEventListener('updatefound',()=>{
        const nw=reg.installing;
        nw.addEventListener('statechange',()=>{
          if(nw.state==='installed'&&navigator.serviceWorker.controller){
            window.__swUpdateReady=true;
            document.dispatchEvent(new CustomEvent('swUpdateReady'));
          }
        });
      });
    }).catch(e=>console.warn('SW:',e));
    navigator.serviceWorker.addEventListener('controllerchange',()=>window.location.reload());
  });
}
</script>
</body>
</html>
